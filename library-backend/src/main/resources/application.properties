server.port=5000

# Cấu hình kết nối AWS RDS MySQL
spring.datasource.url=jdbc:mysql://library-db.cbd8oqbczedx.us-east-1.rds.amazonaws.com:3306/library-db?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
# Thông tin xác thực bảo mật được lấy động từ AWS Secrets Manager (thay thế username/password hardcode)
aws.secretsmanager.secret-name=capstone/library/rds

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cấu hình AWS S3
aws.region=us-east-1
aws.s3.bucket-name=capstone-library-images-nguyentrananhquoc-hcmute

# Giới hạn dung lượng file ảnh upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB